name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Unit tests
        run: ./test.sh
      - name: Build universal app
        run: VEGABAR_ZIP=1 ./build-app.sh
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: VegaBar
          path: build/VegaBar.zip
